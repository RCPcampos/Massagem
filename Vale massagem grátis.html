<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vale massagem grátis</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,500&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6e3d3; --bg2:#efc9b0; --ink:#3b1f2b; --muted:#7a5560;
  --ticket:#fff6ec; --accent:#c2415d; --accent2:#e8a33d; --hole:#f0d3bf;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1218; --bg2:#33192a; --ink:#fbe9dc; --muted:#c9a1ab;
    --ticket:#2e1a24; --accent:#f06a86; --accent2:#f2b45a; --hole:#26141e;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1218; --bg2:#33192a; --ink:#fbe9dc; --muted:#c9a1ab;
  --ticket:#2e1a24; --accent:#f06a86; --accent2:#f2b45a; --hole:#26141e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 15% 20%, var(--bg2) 0, transparent 45%),
    radial-gradient(circle at 85% 85%, var(--bg2) 0, transparent 40%),
    var(--bg);
  overflow-x:hidden;
}
.wrap{width:100%; max-width:760px; text-align:center}
h1{font-family:'Fraunces',serif; font-weight:800; font-size:clamp(2rem,6vw,3.2rem); margin:0 0 6px; letter-spacing:-.02em}
.sub{margin:0 0 30px; color:var(--muted); font-size:1.1rem}

.ticket{
  position:relative; display:flex; background:var(--ticket); border-radius:22px;
  box-shadow:0 30px 50px -20px rgba(120,40,60,.45), 0 0 0 2px var(--accent) inset;
  text-align:left; transform:rotate(-2deg); transition:transform .4s cubic-bezier(.2,.9,.3,1.3);
  cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.ticket:hover,.ticket:focus-visible{transform:rotate(0) scale(1.02); outline:none}
.ticket:focus-visible{box-shadow:0 0 0 4px var(--accent2), 0 30px 50px -20px rgba(120,40,60,.45)}
.main{flex:1; padding:28px 30px; position:relative; overflow:hidden}
.main::before{
  content:""; position:absolute; inset:10px; border:2px dashed var(--accent); border-radius:14px; opacity:.45; pointer-events:none;
}
.kicker{font-weight:700; color:var(--accent); font-size:.95rem; margin:0 0 6px}
.title{font-family:'Fraunces',serif; font-weight:800; font-size:clamp(2rem,7vw,3.4rem); line-height:1; margin:0}
.title em{font-style:italic; font-weight:500; color:var(--accent)}
.rule{margin:14px 0 0; font-size:1.05rem; color:var(--muted); max-width:30ch}
.terms{display:flex; gap:18px; flex-wrap:wrap; margin-top:18px; font-size:.9rem; font-weight:700}
.terms span{padding:5px 12px; border-radius:99px; background:color-mix(in srgb,var(--accent2) 28%,transparent)}
.emoji{position:absolute; right:14px; bottom:4px; font-size:5.5rem; opacity:.18; transform:rotate(12deg)}

.stub{
  width:170px; padding:24px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  border-left:3px dashed var(--accent); position:relative; text-align:center;
}
.stub::before,.stub::after{
  content:""; position:absolute; left:-15px; width:27px; height:27px; border-radius:50%; background:var(--bg);
}
.stub::before{top:-14px} .stub::after{bottom:-14px}
.stamp{
  width:86px; height:86px; border-radius:50%; display:grid; place-items:center; font-size:2.6rem;
  background:var(--accent); color:#fff; box-shadow:0 0 0 5px var(--ticket), 0 0 0 7px var(--accent);
}
.stub strong{font-family:'Fraunces',serif; font-size:1.25rem; line-height:1.1}
.bars{height:34px; width:110px; background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 10px,var(--ink) 10px 13px,transparent 13px 15px)}
.code{font-size:.78rem; color:var(--muted); font-weight:700}

.btn{
  margin-top:34px; font:700 1.1rem 'Nunito',sans-serif; color:#fff; background:var(--accent);
  border:0; border-radius:99px; padding:15px 34px; cursor:pointer; box-shadow:0 10px 24px -8px var(--accent);
  transition:transform .2s; touch-action:manipulation;
}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--accent2); outline-offset:3px}
.msg{min-height:1.6em; margin-top:18px; font-family:'Fraunces',serif; font-style:italic; font-size:1.3rem; color:var(--accent)}

.used .ticket{filter:saturate(.9)}
.seal{
  position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0;
}
.seal b{
  font-family:'Fraunces',serif; font-size:clamp(1.6rem,6vw,2.8rem); color:var(--accent); border:5px solid var(--accent);
  border-radius:12px; padding:6px 22px; transform:rotate(-12deg) scale(2.2); background:color-mix(in srgb,var(--ticket) 80%,transparent);
}
.used .seal{opacity:1}
.used .seal b{transform:rotate(-12deg) scale(1); transition:transform .45s cubic-bezier(.3,1.6,.5,1)}

.hearts{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.hearts i{position:absolute; bottom:-40px; font-style:normal; animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(30deg); opacity:0}}

@media (max-width:620px){
  body{padding:20px 14px}
  .sub{margin-bottom:24px; font-size:1rem}
  .ticket{flex-direction:column; transform:rotate(-1deg); border-radius:18px}
  .main{padding:24px 20px 22px}
  .rule{max-width:none; font-size:1rem}
  .terms{gap:8px; font-size:.85rem}
  .emoji{font-size:4.2rem}
  .stub{width:auto; border-left:0; border-top:3px dashed var(--accent); flex-direction:row; justify-content:space-between; gap:12px; padding:16px 20px}
  .stub::before,.stub::after{top:-14px; bottom:auto}
  .stub::before{left:-14px} .stub::after{left:auto; right:-14px}
  .stamp{width:64px; height:64px; font-size:2rem; flex:none}
  .stub strong{flex:1; font-size:1.1rem; text-align:left}
  .bars{display:none}
  .btn{width:100%; padding:17px 20px; font-size:1.15rem; margin-top:28px}
  .msg{font-size:1.15rem}
}
@media (hover:none){
  .ticket:hover{transform:rotate(-2deg)}
  .ticket:active{transform:rotate(0) scale(.98)}
}
@media (prefers-reduced-motion:reduce){
  .ticket,.btn,.used .seal b{transition:none}
  .hearts{display:none}
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <h1>Um presente para você</h1>
  <p class="sub">Dobre, guarde e use quando o corpo pedir.</p>

  <div class="ticket" id="ticket" tabindex="0" role="button" aria-label="Ingresso de massagem grátis. Toque para usar.">
    <div class="main">
      <p class="kicker">Vale-presente</p>
      <h2 class="title">Massagem <em>grátis</em></h2>
      <p class="rule">Use quando quiser. Sem hora marcada, sem desculpa, sem pressa.</p>
      <div class="terms"><span>Válido para sempre</span><span>Pode pedir mais de uma vez</span></div>
      <div class="emoji" aria-hidden="true">💆</div>
      <div class="seal"><b>Resgatado!</b></div>
    </div>
    <div class="stub">
      <div class="stamp" aria-hidden="true">💖</div>
      <strong>Admita um<br>ingresso</strong>
      <div class="bars" aria-hidden="true"></div>
      <div class="code">Nº 0001</div>
    </div>
  </div>

  <button class="btn" id="use" type="button">Usar meu ingresso</button>
  <div class="msg" id="msg" aria-live="polite"></div>
</main>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
(function(){
  var app=document.getElementById('app'), btn=document.getElementById('use'),
      msg=document.getElementById('msg'), ticket=document.getElementById('ticket'),
      hearts=document.getElementById('hearts'), used=false;
  var frases=['Ótima escolha! Pode se deitar. 💆','Resgate confirmado. Hora de relaxar!','Ingresso carimbado. Capriche nos ombros!'];
  function burst(){
    var e=['💖','✨','💆','🌸','💗'];
    var total=window.innerWidth<620?14:26;
    for(var i=0;i<total;i++){
      var h=document.createElement('i');
      h.textContent=e[i%e.length];
      h.style.left=Math.random()*100+'vw';
      h.style.fontSize=(18+Math.random()*26)+'px';
      h.style.animationDuration=(2.5+Math.random()*2.5)+'s';
      h.style.animationDelay=(Math.random()*.6)+'s';
      hearts.appendChild(h);
      setTimeout(function(n){n.remove()},6500,h);
    }
  }
  function use(){
    if(used){
      used=false; app.classList.remove('used'); btn.textContent='Usar meu ingresso'; msg.textContent='Ingresso renovado. Pode usar de novo!';
      return;
    }
    used=true; app.classList.add('used'); btn.textContent='Usar de novo';
    msg.textContent=frases[Math.floor(Math.random()*frases.length)];
    burst();
  }
  btn.addEventListener('click',use);
  ticket.addEventListener('click',use);
  ticket.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();use();}});
})();
</script>
</body>
</html>
